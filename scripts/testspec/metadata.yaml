schema_version: "0.5"
versions:
  - "v1.2.0"
prefix: "duckdb_"
lifecycle_states:
  frozen: {visibility: always}
  deprecated: {visibility: opt_out, guard: SAMPLE_API_NO_DEPRECATED}
suffixes:
  handles: ""
  callbacks: ""
  aliases: ""
primitives:
  - name: void
    c_type: void
  - name: opaque
    c_type: void
  - name: char
    c_type: char
  - name: bool
    c_type: bool
  - name: idx
    c_type: idx_t
    underlying: uint64_t
  - name: i32
    c_type: int32_t
  - name: state
    c_type: duckdb_state
